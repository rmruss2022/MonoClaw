; HighFi — ESP32-S3 firmware build config
; Target: ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB PSRAM, dual-core LX7)
;
; SAFETY: this firmware drives a heating element on a Li-ion cell. Read
; ../hardware/SAFETY.md before flashing to a board with a coil attached.
; Bench-test audio + app paths with the coil driver DISCONNECTED first.

[platformio]
default_envs = highfi-s3

[env:highfi-s3]
platform  = espressif32          ; Arduino-ESP32 core (LX7 / ESP-IDF underneath)
board     = esp32-s3-devkitc-1   ; closest stock board profile; swap for a custom
                                 ; board .json when the HighFi PCB is spun.
framework = arduino
board_build.mcu = esp32s3

; ---- Flash / PSRAM (N16R8) ----
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
board_build.arduino.memory_type = qio_opi   ; OPI PSRAM on the R8 part

; ---- Serial ----
monitor_speed  = 115200
upload_speed   = 921600
monitor_filters = esp32_exception_decoder, time

; ---- Build flags ----
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB (CDC on boot for logs/flash)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHIGHFI_FW_VERSION=\"0.1.0\"
    ; App/WS protocol contract lives in SPEC.md §4 — keep in lockstep.

; ---- Libraries ----
; Pin exact versions in a real build; these are the intended deps. Where a
; library is conceptual (wrapped behind our own module) it's noted below.
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0            ; state <-> /ws JSON (SPEC §4)
    ; --- networking ---
    ; ESPAsyncWebServer + AsyncTCP provide the /ws + /api/* server used by
    ; src/net/ws_server.*. Use the maintained forks on ESP32-S3:
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.0
    ; --- audio ---
    ; ESP32-audioI2S is the MP3/AAC/WAV/FLAC -> I2S (MAX98357A) decoder we wrap
    ; conceptually in src/audio/audio_player.*. Enable when wiring real audio:
    ; schreibfaul1/ESP32-audioI2S @ ^3.0.11
    ; --- display / LEDs ---
    adafruit/Adafruit SSD1306 @ ^2.5.13       ; OLED (default UI)
    adafruit/Adafruit GFX Library @ ^1.11.11
    ; fastled/FastLED @ ^3.9.0                ; WS2812 ring (alt UI, src/ui/display)
    ; --- power ICs ---
    ; MAX17048 fuel gauge + BQ25895 charger are read over I2C in src/power/*.
    ; Reference drivers (swap for your chosen lib / or our thin register reads):
    ; sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library @ ^1.0.4

; The onboard USB-OTG can also expose the microSD as mass-storage for loading
; tracks without pulling the card; not wired here (v2).
