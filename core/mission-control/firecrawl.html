<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firecrawl Log — Mission Control</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'SF Mono',Monaco,monospace; background:#0a0a0a; color:#e0e0e0; }

    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px; border-bottom:1px solid #1a1a1a; background:#0d0d0d;
      position:sticky; top:0; z-index:10;
    }
    .topbar-left { display:flex; align-items:center; gap:12px; }
    h1 { font-size:15px; color:#f97316; letter-spacing:2px; }
    .api-status { display:flex; align-items:center; gap:6px; font-size:11px; color:#555; }
    .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
    .dot.green { background:#00ff88; box-shadow:0 0 6px #00ff8866; }
    .dot.red { background:#ff4444; }
    .topbar-actions { display:flex; gap:8px; }
    button.btn {
      background:transparent; border:1px solid #2a2a2a; color:#888;
      font-family:inherit; font-size:11px; letter-spacing:0.5px; padding:5px 12px;
      cursor:pointer; transition:all 0.15s;
    }
    button.btn:hover { border-color:#f97316; color:#f97316; }
    button.btn.primary { border-color:#f97316; color:#f97316; background:#1a0d00; }
    button.btn.danger { border-color:#ff4444; color:#ff4444; }
    button.btn.danger:hover { background:#1a0000; }

    /* Log list */
    .log-list { padding:0; }
    .log-empty { padding:48px 20px; text-align:center; color:#333; font-size:13px; }

    .log-entry {
      border-bottom:1px solid #111; padding:12px 20px;
      display:grid; grid-template-columns:80px 70px 1fr auto;
      gap:12px; align-items:start; cursor:pointer; transition:background 0.1s;
    }
    .log-entry:hover { background:#0d0d0d; }
    .log-entry.expanded { background:#0d0d0d; }

    .log-ts { font-size:10px; color:#444; line-height:1.4; }
    .log-action {
      font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      padding:2px 6px; border-radius:2px; text-align:center; align-self:start;
    }
    .log-action.search { color:#a78bfa; border:1px solid #a78bfa44; }
    .log-action.scrape { color:#38bdf8; border:1px solid #38bdf844; }
    .log-action.extract { color:#34d399; border:1px solid #34d39944; }
    .log-action.crawl { color:#fb923c; border:1px solid #fb923c44; }

    .log-main {}
    .log-input { font-size:12px; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .log-meta { font-size:11px; color:#444; margin-top:3px; }
    .log-meta .ok { color:#00ff8866; }
    .log-meta .err { color:#ff4444; }

    .log-results { font-size:11px; color:#555; text-align:right; white-space:nowrap; }

    /* Detail expand */
    .log-detail {
      display:none; border-top:1px solid #1a1a1a;
      padding:12px 20px 16px; background:#0a0a0a;
    }
    .log-detail.open { display:block; }
    .detail-json { font-size:11px; color:#888; background:#111; border:1px solid #1a1a1a;
                   padding:10px; max-height:300px; overflow-y:auto; white-space:pre-wrap; word-wrap:break-word; }

    /* New call drawer */
    .drawer {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      background:#0d0d0d; border-top:1px solid #f97316;
      transform:translateY(100%); transition:transform 0.2s ease;
      max-height:70vh; overflow-y:auto;
    }
    .drawer.open { transform:translateY(0); }
    .drawer-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 20px; border-bottom:1px solid #1a1a1a; background:#111;
      position:sticky; top:0;
    }
    .drawer-title { font-size:13px; color:#f97316; letter-spacing:1px; }
    .drawer-body { padding:16px 20px; }

    .tabs { display:flex; gap:0; border-bottom:1px solid #1a1a1a; margin-bottom:16px; }
    .tab { padding:6px 14px; font-family:inherit; font-size:11px; letter-spacing:1px; text-transform:uppercase;
           background:transparent; border:none; color:#444; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .tab.active { color:#f97316; border-bottom-color:#f97316; }
    .panel { display:none; }
    .panel.active { display:block; }

    label { font-size:10px; color:#555; letter-spacing:0.5px; display:block; margin-bottom:4px; text-transform:uppercase; }
    input, textarea, select {
      width:100%; background:#111; border:1px solid #222; color:#e0e0e0;
      font-family:inherit; font-size:12px; padding:7px 10px; outline:none;
    }
    input:focus, textarea:focus { border-color:#f97316; }
    textarea { resize:vertical; min-height:56px; }
    .row { display:flex; gap:10px; margin-bottom:12px; align-items:flex-end; }
    .row > * { flex:1; }
    .row > button { flex:0 0 auto; }

    .spinner { display:inline-block; width:10px; height:10px; border:2px solid #333;
               border-top-color:#f97316; border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:4px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1>🔥 FIRECRAWL</h1>
    <div class="api-status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn danger" onclick="clearLog()">Clear Log</button>
    <button class="btn" onclick="loadLog()">↻ Refresh</button>
    <button class="btn primary" onclick="openDrawer()">+ New Call</button>
  </div>
</div>

<div id="logList" class="log-list">
  <div class="log-empty">Loading...</div>
</div>

<!-- New call drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">NEW FIRECRAWL CALL</span>
    <button class="btn" onclick="closeDrawer()">✕ Close</button>
  </div>
  <div class="drawer-body">
    <div class="tabs">
      <button class="tab active" onclick="showTab('search')">Search</button>
      <button class="tab" onclick="showTab('scrape')">Scrape</button>
      <button class="tab" onclick="showTab('extract')">Extract</button>
      <button class="tab" onclick="showTab('crawl')">Crawl</button>
    </div>

    <div id="panel-search" class="panel active">
      <div class="row">
        <div>
          <label>Query</label>
          <input id="searchQuery" placeholder="Search the web..." onkeydown="if(event.key==='Enter')runCall('search')">
        </div>
        <div style="flex:0 0 70px">
          <label>Results</label>
          <select id="searchLimit">
            <option value="5">5</option><option value="10" selected>10</option><option value="20">20</option>
          </select>
        </div>
        <button class="btn primary" onclick="runCall('search')" id="searchBtn">Run</button>
      </div>
    </div>

    <div id="panel-scrape" class="panel">
      <div class="row">
        <div>
          <label>URL</label>
          <input id="scrapeUrl" placeholder="https://..." onkeydown="if(event.key==='Enter')runCall('scrape')">
        </div>
        <button class="btn primary" onclick="runCall('scrape')" id="scrapeBtn">Run</button>
      </div>
    </div>

    <div id="panel-extract" class="panel">
      <div style="margin-bottom:12px">
        <label>URLs (one per line)</label>
        <textarea id="extractUrls" placeholder="https://..."></textarea>
      </div>
      <div class="row">
        <div>
          <label>Prompt — what to extract</label>
          <input id="extractPrompt" placeholder="Extract event name, ticket prices, availability...">
        </div>
        <button class="btn primary" onclick="runCall('extract')" id="extractBtn">Run</button>
      </div>
    </div>

    <div id="panel-crawl" class="panel">
      <div class="row">
        <div>
          <label>Start URL</label>
          <input id="crawlUrl" placeholder="https://...">
        </div>
        <div style="flex:0 0 70px">
          <label>Depth</label>
          <select id="crawlDepth"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
        </div>
        <button class="btn primary" onclick="runCall('crawl')" id="crawlBtn">Run</button>
      </div>
      <div style="margin-bottom:12px">
        <label>Prompt (optional)</label>
        <input id="crawlPrompt" placeholder="Find all ticket links and prices">
      </div>
    </div>

    <div id="callResult" style="display:none; margin-top:12px;
      background:#111; border:1px solid #222; padding:12px; font-size:11px;
      color:#888; max-height:200px; overflow-y:auto; white-space:pre-wrap; word-wrap:break-word;"></div>
  </div>
</div>

<script>
  function fmtTime(ts) {
    const d = new Date(ts);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const time = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    return isToday ? time : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + time;
  }

  function inputLabel(entry) {
    const i = entry.input || {};
    if (entry.action === 'search') return i.query || '—';
    if (entry.action === 'scrape') return i.url || '—';
    if (entry.action === 'extract') return (i.prompt || '') + (i.urls?.length ? ` · ${i.urls.length} URL(s)` : '');
    if (entry.action === 'crawl') return i.url || '—';
    return JSON.stringify(i);
  }

  async function loadLog() {
    const r = await fetch('/api/firecrawl/log');
    const entries = await r.json();
    const el = document.getElementById('logList');
    if (!entries.length) {
      el.innerHTML = '<div class="log-empty">No calls yet. Hit "+ New Call" to get started.</div>';
      return;
    }
    el.innerHTML = entries.map((e, idx) => `
      <div class="log-entry" id="entry-${idx}" onclick="toggleDetail(${idx}, this)">
        <div class="log-ts">${fmtTime(e.ts)}</div>
        <div class="log-action ${e.action}">${e.action}</div>
        <div class="log-main">
          <div class="log-input">${escHtml(inputLabel(e))}</div>
          <div class="log-meta">
            <span class="${e.success?'ok':'err'}">${e.success?'✓':'✗'} ${e.status}</span>
            · ${e.durationMs}ms
            · ${e.source || 'api'}
          </div>
        </div>
        <div class="log-results">${e.resultCount != null ? e.resultCount + ' result' + (e.resultCount===1?'':'s') : ''}</div>
      </div>
      <div class="log-detail" id="detail-${idx}">
        <div class="detail-json">${escHtml(JSON.stringify(e, null, 2))}</div>
      </div>
    `).join('');
  }

  function toggleDetail(idx, row) {
    const d = document.getElementById('detail-'+idx);
    const open = d.classList.toggle('open');
    row.classList.toggle('expanded', open);
  }

  async function clearLog() {
    if (!confirm('Clear the entire Firecrawl call log?')) return;
    await fetch('/api/firecrawl/log', { method:'DELETE' });
    loadLog();
  }

  // Status check
  async function checkStatus() {
    try {
      const r = await fetch('/api/firecrawl/status');
      const d = await r.json();
      document.getElementById('statusDot').className = 'dot ' + (d.online ? 'green' : 'red');
      document.getElementById('statusText').textContent = d.online ? `Online · ${d.key}` : `Offline · ${d.reason||''}`;
    } catch { document.getElementById('statusText').textContent = 'unreachable'; }
  }

  function openDrawer() { document.getElementById('drawer').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('callResult').style.display='none'; }

  function showTab(name) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['search','scrape','extract','crawl'][i]===name));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-'+name).classList.add('active');
  }

  async function runCall(action) {
    const btnId = action+'Btn';
    const btn = document.getElementById(btnId);
    const resultEl = document.getElementById('callResult');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Running…';
    resultEl.style.display = 'block';
    resultEl.textContent = 'Running…';

    let payload = {};
    if (action === 'search') payload = { query: document.getElementById('searchQuery').value, limit: parseInt(document.getElementById('searchLimit').value) };
    else if (action === 'scrape') payload = { url: document.getElementById('scrapeUrl').value, formats: ['markdown'] };
    else if (action === 'extract') payload = { urls: document.getElementById('extractUrls').value.trim().split('\n').filter(Boolean), prompt: document.getElementById('extractPrompt').value };
    else if (action === 'crawl') payload = { url: document.getElementById('crawlUrl').value, prompt: document.getElementById('crawlPrompt').value, maxDiscoveryDepth: parseInt(document.getElementById('crawlDepth').value) };

    try {
      const r = await fetch(`/api/firecrawl/${action}`, {
        method:'POST', headers:{'Content-Type':'application/json', 'X-Source':'dashboard'},
        body: JSON.stringify(payload)
      });
      const d = await r.json();

      // Show result summary
      if (action === 'search') {
        const results = d?.data?.web || d?.results || [];
        resultEl.textContent = results.map(r => `${r.title||r.url}\n${r.url}\n${(r.description||'').slice(0,120)}\n`).join('\n');
      } else if (action === 'scrape') {
        resultEl.textContent = (d?.data?.markdown || d?.markdown || JSON.stringify(d)).slice(0, 2000);
      } else {
        resultEl.textContent = JSON.stringify(d, null, 2).slice(0, 2000);
      }

      loadLog(); // refresh log
    } catch(e) {
      resultEl.textContent = 'Error: ' + e.message;
    }

    btn.disabled = false;
    btn.textContent = 'Run';
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Init
  checkStatus();
  loadLog();
  setInterval(loadLog, 30000);
</script>
</body>
</html>
