<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242d"/><stop offset="0.55" stop-color="#161a21"/><stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <radialGradient id="softbox" cx="34%" cy="26%" r="55%">
      <stop offset="0" stop-color="#aebdd0" stop-opacity="0.20"/><stop offset="1" stop-color="#aebdd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2620"/><stop offset="0.5" stop-color="#1c1a17"/><stop offset="1" stop-color="#131211"/>
    </linearGradient>
    <linearGradient id="deskedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4034" stop-opacity="0.7"/><stop offset="1" stop-color="#4a4034" stop-opacity="0"/>
    </linearGradient>

    <!-- PETG shell: left-lit matte plastic with a soft specular streak -->
    <linearGradient id="petg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1015"/><stop offset="0.10" stop-color="#20242d"/>
      <stop offset="0.24" stop-color="#3a404b"/><stop offset="0.34" stop-color="#2f343e"/>
      <stop offset="0.52" stop-color="#272b34"/><stop offset="0.72" stop-color="#191c23"/>
      <stop offset="0.88" stop-color="#111319"/><stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0f13"/><stop offset="0.12" stop-color="#191c23"/>
      <stop offset="0.32" stop-color="#282c35"/><stop offset="0.5" stop-color="#22262e"/>
      <stop offset="0.72" stop-color="#15181e"/><stop offset="0.9" stop-color="#0e1014"/><stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="diffuser" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#3b414d"/>
      <stop offset="0.55" stop-color="#262b35"/><stop offset="1" stop-color="#14171e"/>
    </radialGradient>
    <radialGradient id="topface" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#23272f"/><stop offset="1" stop-color="#0e1015"/>
    </radialGradient>
    <radialGradient id="ledsoft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5affb0" stop-opacity="0.95"/><stop offset="0.5" stop-color="#3ddc97" stop-opacity="0.55"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>

    <!-- fabric weave: fine twill -->
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="6" height="6" fill="#000" opacity="0"/>
      <path d="M0 6 L6 0" stroke="#000" stroke-width="1.1" opacity="0.28"/>
      <path d="M-1 1 L1 -1 M5 7 L7 5" stroke="#3a4150" stroke-width="0.7" opacity="0.18"/>
    </pattern>
    <!-- printed layer lines -->
    <pattern id="layers" width="8" height="5" patternUnits="userSpaceOnUse">
      <rect width="8" height="5" fill="#000" opacity="0"/>
      <line x1="0" y1="0.5" x2="8" y2="0.5" stroke="#000" stroke-width="0.8" opacity="0.22"/>
      <line x1="0" y1="2.5" x2="8" y2="2.5" stroke="#4a515f" stroke-width="0.5" opacity="0.10"/>
    </pattern>

    <filter id="shadowblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glowblur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- environment -->
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect width="1920" height="1080" fill="url(#softbox)"/>
  <rect x="0" y="770" width="1920" height="310" fill="url(#desk)"/>
  <rect x="0" y="770" width="1920" height="4" fill="url(#deskedge)"/>

  <!-- contact shadow -->
  <ellipse cx="740" cy="792" rx="240" ry="40" fill="#000" opacity="0.62" filter="url(#shadowblur)"/>
  <!-- faint reflection -->
  <g transform="translate(740 796) scale(1 -0.28)" opacity="0.14">
    <path d="M-150 -455 A150 40 0 0 0 150 -455 L150 0 A150 40 0 0 1 -150 0 Z" fill="#3a4150" filter="url(#softblur)"/>
  </g>

  <!-- ================= THE POD ================= -->
  <g transform="translate(740 0)">
    <!-- printed base lip -->
    <ellipse cx="0" cy="770" rx="156" ry="42" fill="#0a0c10"/>
    <path d="M-156 742 A156 42 0 0 0 156 742 L156 772 A156 42 0 0 1 -156 772 Z" fill="#101319"/>

    <!-- body shell -->
    <path id="bodyPath" d="M-150 342 A150 42 0 0 0 150 342 L150 752 A150 42 0 0 1 -150 752 Z" fill="url(#petg)"/>
    <clipPath id="bodyClip"><path d="M-150 342 A150 42 0 0 0 150 342 L150 752 A150 42 0 0 1 -150 752 Z"/></clipPath>
    <g clip-path="url(#bodyClip)">
      <!-- fabric grille band -->
      <rect x="-150" y="470" width="300" height="232" fill="url(#fabric)"/>
      <rect x="-150" y="470" width="300" height="232" fill="url(#weave)"/>
      <!-- grille top & bottom trim shadows -->
      <rect x="-150" y="466" width="300" height="6" fill="#000" opacity="0.45"/>
      <rect x="-150" y="700" width="300" height="6" fill="#000" opacity="0.45"/>
      <!-- printed layer lines over lower shell + base -->
      <rect x="-150" y="702" width="300" height="70" fill="url(#layers)"/>
      <rect x="-150" y="342" width="300" height="128" fill="url(#layers)" opacity="0.5"/>
      <!-- soft specular streak (left softbox) -->
      <ellipse cx="-70" cy="520" rx="38" ry="150" fill="#aebdd0" opacity="0.06" filter="url(#softblur)"/>
      <!-- vertical print seam -->
      <line x1="120" y1="352" x2="120" y2="752" stroke="#000" stroke-width="1" opacity="0.35"/>
      <line x1="121.5" y1="352" x2="121.5" y2="752" stroke="#4a515f" stroke-width="0.6" opacity="0.18"/>
    </g>
    <!-- shell top rim -->
    <ellipse cx="0" cy="342" rx="150" ry="42" fill="none" stroke="#454c5a" stroke-width="1.4" opacity="0.55"/>

    <!-- rubber foot at very bottom -->
    <ellipse cx="0" cy="768" rx="120" ry="30" fill="#07080b" opacity="0.9"/>

    <!-- ===== top: diffuser cap + LED ring ===== -->
    <!-- LED glow bleeding through frosted diffuser -->
    <ellipse cx="0" cy="360" rx="150" ry="42" fill="url(#ledsoft)" opacity="0.5" filter="url(#glowblur)"/>
    <!-- diffuser cap -->
    <ellipse cx="0" cy="340" rx="150" ry="42" fill="url(#diffuser)"/>
    <!-- frosted LED ring channel -->
    <ellipse cx="0" cy="342" rx="128" ry="34" fill="none" stroke="#3ddc97" stroke-width="10" opacity="0.28" filter="url(#glowblur)"/>
    <ellipse cx="0" cy="342" rx="128" ry="34" fill="none" stroke="#7dffc0" stroke-width="3" opacity="0.9"/>
    <ellipse cx="0" cy="342" rx="128" ry="34" fill="none" stroke="#3ddc97" stroke-width="6" opacity="0.35"/>
    <!-- recessed top control face -->
    <ellipse cx="0" cy="332" rx="108" ry="27" fill="url(#topface)"/>
    <ellipse cx="0" cy="332" rx="108" ry="27" fill="none" stroke="#000" stroke-width="1.4" opacity="0.5"/>
    <!-- mic pinholes -->
    <g fill="#05060a">
      <circle cx="-46" cy="336" r="3"/><circle cx="46" cy="336" r="3"/>
      <circle cx="-24" cy="325" r="3"/><circle cx="24" cy="325" r="3"/>
      <circle cx="0" cy="344" r="3"/>
    </g>
    <!-- physical top button -->
    <ellipse cx="0" cy="330" rx="15" ry="7" fill="#1a1e26" stroke="#3a4150" stroke-width="1.2"/>
    <!-- debossed brand dot on cap front -->
    <circle cx="0" cy="398" r="4.5" fill="none" stroke="#3ddc97" stroke-width="1.6" opacity="0.75"/>
  </g>

  <!-- ================= LABELS (minimal, product-shot) ================= -->
  <g>
    <svg x="96" y="92" width="30" height="30" viewBox="0 0 48 48">
      <path d="M24 5 6 20v22a2 2 0 0 0 2 2h32a2 2 0 0 0 2-2V20L24 5Z" fill="none" stroke="#3ddc97" stroke-width="2.6"/>
      <circle cx="24" cy="26" r="5" fill="none" stroke="#3ddc97" stroke-width="2.6"/>
      <rect x="22.2" y="29" width="3.6" height="9" rx="1.6" fill="#3ddc97"/>
    </svg>
    <text x="136" y="116" font-size="26" font-weight="bold" fill="#e7ebf3">open<tspan fill="#3ddc97">home</tspan> <tspan fill="#8b93a7" font-weight="normal" font-size="20">mini</tspan></text>
    <text x="97" y="150" font-size="14" letter-spacing="2" fill="#8b93a7">3D-PRINTED VOICE POD &#183; STUDIO RENDER</text>
  </g>

  <!-- material chip, bottom-left -->
  <g transform="translate(96 946)">
    <rect x="0" y="0" width="470" height="52" rx="12" fill="#171a21" stroke="#272c37"/>
    <circle cx="30" cy="26" r="7" fill="none" stroke="#3ddc97" stroke-width="2"/>
    <text x="52" y="32" font-size="15.5" fill="#e7ebf3">PETG &#183; 0.2 mm layers &#183; 2-part shell &#183; M2.5 heat-set inserts</text>
  </g>

  <!-- spec ticks, right side -->
  <g transform="translate(1180 400)" font-size="15">
    <g stroke="#3ddc97" stroke-width="1.4" opacity="0.8">
      <line x1="-260" y1="-40" x2="0" y2="-40"/><circle cx="0" cy="-40" r="3.5" fill="#3ddc97"/>
      <line x1="-150" y1="60" x2="0" y2="60"/><circle cx="0" cy="60" r="3.5" fill="#3ddc97"/>
      <line x1="-120" y1="210" x2="0" y2="210"/><circle cx="0" cy="210" r="3.5" fill="#3ddc97"/>
      <line x1="-150" y1="360" x2="0" y2="360"/><circle cx="0" cy="360" r="3.5" fill="#3ddc97"/>
    </g>
    <text x="14" y="-35" fill="#e7ebf3" font-weight="bold">Frosted diffuser ring<tspan x="14" dy="20" fill="#8b93a7" font-size="13" font-weight="normal">12 addressable LEDs glow through</tspan></text>
    <text x="14" y="65" fill="#e7ebf3" font-weight="bold">Far-field mic array<tspan x="14" dy="20" fill="#8b93a7" font-size="13" font-weight="normal">5 pinholes + physical mute button</tspan></text>
    <text x="14" y="215" fill="#e7ebf3" font-weight="bold">Acoustic fabric grille<tspan x="14" dy="20" fill="#8b93a7" font-size="13" font-weight="normal">wraps the 3&#8243; driver + radiator</tspan></text>
    <text x="14" y="365" fill="#e7ebf3" font-weight="bold">Printed base + rubber foot<tspan x="14" dy="20" fill="#8b93a7" font-size="13" font-weight="normal">visible 0.2 mm layer lines &#183; USB-C in rear</tspan></text>
  </g>

  <text x="1824" y="150" text-anchor="end" font-size="13" letter-spacing="3" fill="#8b93a7">~110 mm &#216; &#183; 128 mm TALL</text>
</svg>
