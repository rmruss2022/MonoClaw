<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>openhome · climate</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
<meta name="theme-color" content="#0e1014" />
<style>
  :root{--bg:#0e1014;--panel:#171a21;--panel2:#1e222b;--line:#272c37;--text:#e7ebf3;--muted:#8b93a7;--accent:#3ddc97;--accent-dim:#1f7a56;--heat:#ff8a4c;--cool:#4c9bff;--danger:#ef5350;--radius:14px}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header.top{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 14px) 22px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141821,var(--bg))}
  .brand a{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:700}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid transparent}
  nav a:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}
  nav a.active{color:var(--accent);border-color:var(--accent-dim);background:rgba(61,220,151,.08)}
  main{padding:22px;max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  main>*{min-width:0}
  h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .badge{font-size:11px;color:var(--accent);background:rgba(61,220,151,.1);border:1px solid var(--accent-dim);padding:1px 7px;border-radius:999px;white-space:nowrap}
  .badge.esp{color:#3ddc97}.badge.matter{color:#c39bff;background:rgba(195,155,255,.1);border-color:#453a5e}
  .badge.off{color:#8a94a6;background:rgba(138,148,166,.12);border-color:#333}.badge.live{color:#0b0f14;background:var(--accent);border-color:var(--accent);font-weight:700}.badge.warn{color:#e6b800;background:rgba(230,184,0,.12);border-color:#5a4a00}
  button{font:inherit;cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
  button:hover{border-color:var(--accent-dim)}
  button.primary{background:var(--accent);color:#08130d;border-color:var(--accent);font-weight:700}
  button.small{padding:5px 10px;font-size:13px;border-radius:8px}
  select{font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 8px}
  .hero{background:linear-gradient(135deg,#241b16,#141821);border:1px solid #4a3320}
  .note{font-size:13px;color:var(--muted)}
  input[type=text]{font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 13px;width:100%}
  /* thermostat switcher */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .ttab{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600}
  .ttab.on{color:var(--text);border-color:var(--accent-dim);background:rgba(61,220,151,.08)}
  /* dial */
  .dialwrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
  #dial{width:300px;max-width:88vw;height:auto;touch-action:none;user-select:none}
  .ctxt{text-align:center;pointer-events:none}
  .status{margin-top:2px;font-size:14px;font-weight:600}
  .adjust{display:flex;gap:26px;align-items:center;justify-content:center;margin:6px 0 2px}
  .rnd{width:52px;height:52px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line)}
  .modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .mode{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;padding:9px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12px;color:var(--muted)}
  .mode .ic{font-size:19px}
  .mode.on{color:var(--text);border-color:var(--accent-dim);background:rgba(61,220,151,.1)}
  .mode.on.heat{border-color:var(--heat);background:rgba(255,138,76,.12);color:#ffd0b0}
  .mode.on.cool{border-color:var(--cool);background:rgba(76,155,255,.12);color:#bcd8ff}
  .meta{display:flex;gap:18px;justify-content:center;margin-top:12px;color:var(--muted);font-size:13px}
  .empty{text-align:center;padding:34px 16px}.empty .ic{font-size:44px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--panel2);border:1px solid var(--accent-dim);color:var(--text);padding:10px 16px;border-radius:10px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  /* wizard (shared pattern) */
  .wiz{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}.wiz.show{display:flex}
  .wiz .wh{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;border-bottom:1px solid var(--line)}
  .wiz .body{flex:1;overflow:auto;padding:24px 20px;max-width:520px;margin:0 auto;width:100%}
  .wiz .foot{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-width:520px;margin:0 auto;width:100%;display:flex;gap:10px}.wiz .foot button{flex:1}
  .wiz h1{font-size:22px;margin:0 0 6px}.wiz p.sub{color:var(--muted);margin:0 0 20px}
  .wizcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:12px;font-size:16px;color:var(--text);cursor:pointer}
  .wizcard:hover{border-color:var(--accent-dim);background:#232833}.wizcard .ic{font-size:26px;width:34px;text-align:center}.wizcard .cap{font-size:12px;color:var(--muted);font-weight:400}
  .devrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:10px;cursor:pointer}
  .radar{width:130px;height:130px;margin:26px auto;position:relative}.radar .ring{position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;opacity:0;animation:radar 1.9s ease-out infinite}.radar .ring:nth-child(2){animation-delay:.63s}.radar .ring:nth-child(3){animation-delay:1.26s}.radar .core{position:absolute;inset:42%;background:var(--accent);border-radius:50%;box-shadow:0 0 18px var(--accent)}
  @keyframes radar{0%{transform:scale(.25);opacity:.85}100%{transform:scale(1);opacity:0}}
  .spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--panel2);border-top-color:var(--accent);margin:28px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}.chip{padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:15px}.chip.on{background:var(--accent);color:#08130d;border-color:var(--accent);font-weight:700}
  .check{width:80px;height:80px;border-radius:50%;background:var(--accent);color:#08130d;display:flex;align-items:center;justify-content:center;font-size:42px;margin:14px auto 18px;animation:pop .32s ease}@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .center{text-align:center}
  @media(max-width:640px){
    header.top{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;gap:8px 12px}
    nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:2px 0 0;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap}
    header.top>div[style*="flex:1"]{display:none}
    main{padding:16px 14px;gap:16px}.card{padding:14px}
    select,input[type=text]{font-size:16px}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><a href="/"><img src="/assets/brand/logo.svg" alt="openhome" height="24"/></a></div>
    <nav>
      <a href="/">Home</a><a href="/control">Control</a><a href="/music">Music</a><a href="/lights">Lights</a><a href="/speakers">Speakers</a><a href="/climate" class="active">Climate</a><a href="/docs">Docs</a>
    </nav>
    <div style="flex:1"></div>
    <span class="small muted" id="counts"></span>
  </header>

  <main>
    <section class="card hero">
      <div class="row between" style="gap:12px;flex-wrap:wrap">
        <div style="min-width:0"><h2 style="color:var(--text)">Climate</h2>
          <div class="note" style="margin-top:4px">Local thermostat control — ESPHome &amp; Matter, no cloud.</div></div>
        <div class="row" style="gap:8px;align-items:center"><span id="devTools"></span><button class="primary" onclick="openWiz()">＋ Add thermostat</button></div>
      </div>
    </section>

    <section class="card" id="panel"></section>
  </main>

  <!-- onboarding wizard -->
  <div class="wiz" id="wizard">
    <div class="wh"><button class="small" onclick="wizBack()" id="wizBack">‹ Back</button><b id="wizTitle">Add a thermostat</b><div style="flex:1"></div><button class="small" onclick="closeWiz()">✕</button></div>
    <div class="body" id="wizBody"></div>
    <div class="foot" id="wizFoot"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&#39;");
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3000);}
async function state(){return await (await fetch("/climate/state")).json();}
async function post(cmd,payload={}){try{return await (await fetch("/climate/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd,...payload})})).json();}catch(e){return{};}}
async function api(cmd,payload={}){const j=await post(cmd,payload);if(j.hint)toast(j.hint);if(j.state){S=j.state;renderPanel();}else refresh();return j;}
async function refresh(){try{S=await state();renderPanel();}catch(e){}}

const ROOMS=["Living Room","Kitchen","Bedroom","Office","Hallway","Bathroom","Basement","Upstairs","Downstairs"];
const MODES=[["off","⭘","Off"],["heat","🔥","Heat"],["cool","❄️","Cool"],["auto","⇅","Auto"],["fan","🌀","Fan"]];
const MODECOL={heat:"var(--heat)",cool:"var(--cool)",auto:"var(--accent)",fan:"var(--muted)",off:"#4a5162"};

let S=null, selId=null, dragging=false;
function selected(){const a=(S&&S.thermostats)||[];return a.find(t=>t.id===selId)||a[0]||null;}

/* ---- dial geometry ---- */
const CX=150,CY=150,R=118,A0=135,SWEEP=270;
function polar(r,deg){const a=deg*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function arc(r,d0,d1){const[x0,y0]=polar(r,d0),[x1,y1]=polar(r,d1);const large=(d1-d0)>180?1:0;return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;}
function frac(t){return Math.max(0,Math.min(1,(t.targetF-t.minF)/(t.maxF-t.minF)));}
function ticks(){let s="";for(let i=0;i<=54;i++){const d=A0+(i/54)*SWEEP;const[x0,y0]=polar(R+8,d),[x1,y1]=polar(R+(i%9===0?0:4),d);s+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#2a303c" stroke-width="${i%9===0?2:1}"/>`;}return s;}

function renderDevTools(all){
  const el=$("devTools");if(!el)return;
  if(!(S&&S.dev)){el.innerHTML="";return;}
  const hasDemo=all.some(t=>t.real&&/^Test Thermostat/.test(t.name));
  el.innerHTML=`<button class="small" style="border-color:var(--accent);color:var(--accent)" onclick="api('add-demo-thermostat')" title="Adds an emulated ESPHome thermostat (dev only)">🧪 Add test device</button>`
    +(hasDemo?`<button class="small" style="margin-left:6px" onclick="api('clear-demo-thermostats')">Clear test</button>`:"");
}
function renderPanel(){
  const all=(S&&S.thermostats)||[];const c=(S&&S.counts)||{total:0};
  renderDevTools(all);
  $("counts").textContent=`${c.total} thermostat${c.total===1?'':'s'}${c.active?` · ${c.active} active`:''}`;
  if(!all.length){$("panel").innerHTML=`<div class="empty"><div class="ic">🌡️</div><h3 style="margin:10px 0 4px">No thermostats yet</h3><div class="note">Add an ESPHome or Matter thermostat to control your heating &amp; cooling.</div><div style="margin-top:16px"><button class="primary" onclick="openWiz()">＋ Add thermostat</button></div></div>`;return;}
  if(!selId||!all.find(t=>t.id===selId))selId=all[0].id;
  const t=selected();const col=MODECOL[t.mode]||"#4a5162";
  const f=frac(t);const tgtDeg=A0+f*SWEEP;
  const [hx,hy]=polar(R,tgtDeg);const [cx2,cy2]=polar(R,A0+((t.currentF-t.minF)/(t.maxF-t.minF))*SWEEP);
  const actLabel={heating:"Heating",cooling:"Cooling",fan:"Fan running",idle:t.mode==='off'?"Off":"Idle"}[t.action];
  const actCol=t.action==='heating'?'var(--heat)':t.action==='cooling'?'var(--cool)':'var(--muted)';
  const tabs=all.length>1?`<div class="tabs" style="margin-bottom:14px">${all.map(x=>`<div class="ttab ${x.id===t.id?'on':''}" onclick="selId='${x.id}';renderPanel()">${esc(x.name)} · ${Math.round(x.currentF)}°</div>`).join('')}</div>`:'';
  $("panel").innerHTML=`${tabs}
    <div class="dialwrap">
      <svg id="dial" viewBox="0 0 300 300">
        <g>${ticks()}</g>
        <path d="${arc(R,A0,A0+SWEEP)}" fill="none" stroke="#20252f" stroke-width="14" stroke-linecap="round"/>
        <path d="${arc(R,A0,Math.max(A0+0.1,tgtDeg))}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/>
        <circle cx="${cx2.toFixed(1)}" cy="${cy2.toFixed(1)}" r="4" fill="#e7ebf3" opacity=".8"/>
        <circle id="handle" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="13" fill="#fff" stroke="${col}" stroke-width="3"/>
        <text x="150" y="140" text-anchor="middle" font-size="58" font-weight="700" fill="#e7ebf3">${Math.round(t.targetF)}°</text>
        <text x="150" y="172" text-anchor="middle" font-size="14" fill="${actCol}" font-weight="600">${actLabel}</text>
        <text x="150" y="196" text-anchor="middle" font-size="13" fill="#8b93a7">now ${Math.round(t.currentF)}°${t.humidity!=null?` · ${Math.round(t.humidity)}%`:''}</text>
      </svg>
      <div class="adjust">
        <div class="rnd" onclick="bump(-1)">−</div>
        <div class="small muted">${esc(t.name)}${t.real?` · <span class="badge ${t.backend==='matter'?'matter':'esp'}">${t.backend==='matter'?'Matter':'ESPHome'}</span>`:` · <span class="badge off">demo</span>`}${t.real&&t.status&&t.status!=='connected'?` <span class="badge warn">${t.status}</span>`:''}</div>
        <div class="rnd" onclick="bump(1)">+</div>
      </div>
      <div class="modes">${MODES.map(m=>`<div class="mode ${t.mode===m[0]?'on '+m[0]:''}" onclick="setMode('${m[0]}')"><span class="ic">${m[1]}</span>${m[2]}</div>`).join('')}</div>
      <div class="meta">
        <span>📍 ${esc(t.room)}</span>
        ${t.real?`<span style="cursor:pointer" onclick="renameT('${t.id}')">✏️ Rename</span><span style="cursor:pointer" onclick="moveT('${t.id}')">🏠 Room</span>${t.status!=='connected'?`<span style="cursor:pointer" onclick="api('reconnect-thermostat',{id:'${t.id}'})">↻ Reconnect</span>`:''}<span style="cursor:pointer;color:var(--danger)" onclick="api('remove-thermostat',{id:'${t.id}'})">✕ Remove</span>`:''}
      </div>
    </div>`;
  wireDial(t);
}
function cAction(mode,cur,tgt){if(mode==='off')return'idle';if(mode==='fan')return'fan';if(mode==='heat')return tgt>cur+0.4?'heating':'idle';if(mode==='cool')return tgt<cur-0.4?'cooling':'idle';return tgt>cur+0.4?'heating':tgt<cur-0.4?'cooling':'idle';}
let setT;function setTemp(tF){const t=selected();if(!t)return;t.targetF=Math.max(t.minF,Math.min(t.maxF,tF));t.action=cAction(t.mode,t.currentF,t.targetF);renderPanel();clearTimeout(setT);setT=setTimeout(()=>post('set-temp',{id:t.id,targetF:Math.round(t.targetF)}),160);}
function bump(d){const t=selected();if(t)setTemp(Math.round(t.targetF)+d);}
function setMode(m){const t=selected();if(!t)return;api('set-mode',{id:t.id,mode:m});}
function renameT(id){const t=(S.thermostats||[]).find(x=>x.id===id);const v=prompt("Rename thermostat",t?t.name:'');if(v&&v.trim())api('rename-thermostat',{id,name:v.trim()});}
function moveT(id){const t=(S.thermostats||[]).find(x=>x.id===id);const v=prompt("Room",t?t.room:'');if(v&&v.trim())api('climate-room',{id,room:v.trim()});}

function angleFromEvent(ev){const svg=$("dial"),rect=svg.getBoundingClientRect();const p=ev.touches?ev.touches[0]:ev;
  const x=(p.clientX-rect.left)/rect.width*300,y=(p.clientY-rect.top)/rect.height*300;
  let d=Math.atan2(y-CY,x-CX)*180/Math.PI;if(d<0)d+=360;if(d<A0-0.001&&d<=45)d+=360;return d;}
function dialTemp(ev){const t=selected();if(!t)return;let d=angleFromEvent(ev);d=Math.max(A0,Math.min(A0+SWEEP,d));const fr=(d-A0)/SWEEP;setTemp(Math.round(t.minF+fr*(t.maxF-t.minF)));}
function wireDial(t){const svg=$("dial");if(!svg||svg._wired)return;svg._wired=true;
  const dn=e=>{dragging=true;dialTemp(e);e.preventDefault();},mv=e=>{if(dragging){dialTemp(e);e.preventDefault();}},up=()=>{dragging=false;};
  svg.addEventListener('mousedown',dn);window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
  svg.addEventListener('touchstart',dn,{passive:false});svg.addEventListener('touchmove',mv,{passive:false});window.addEventListener('touchend',up);}

/* ============ Onboarding wizard ============ */
const W={step:'type',backend:null,found:[],note:'',sel:null,tId:null,tName:'',status:'',room:'Hallway',err:''};
function openWiz(){Object.assign(W,{step:'type',backend:null,found:[],note:'',sel:null,tId:null,tName:'',status:'',room:'Hallway',err:''});$("wizard").classList.add('show');renderWiz();}
function closeWiz(){$("wizard").classList.remove('show');refresh();}
function goto(s){W.step=s;renderWiz();if(s==='scan')runScan();}
function wizBack(){const m={type:null,scan:'type',results:'type',manual:'type',connect:'results',room:'connect',done:null};const p=m[W.step];if(!p){closeWiz();return;}goto(p);}
function pickBackend(b){W.backend=b;goto('scan');}
async function runScan(){try{const r=await(await fetch('/climate/discover?backend='+W.backend)).json();W.found=r.found||[];W.note=r.note||'';}catch(e){W.found=[];W.note='Scan failed — try again.';}goto('results');}
function selectDevice(i){W.sel=W.found[i];connectSel();}
function manualSubmit(){const name=($("mName")||{}).value.trim();if(!name){toast("Give it a name");return;}const addr=($("mAddr")||{}).value.trim();const ent=($("mEnt")||{}).value.trim();W.sel={name,backend:W.backend,address:addr||undefined,entity:ent||undefined};connectSel();}
async function connectSel(){W.step='connect';W.err='';W.tName=W.sel.name;renderWiz();
  await post('onboard-thermostat',{device:{...W.sel,backend:W.backend},room:W.room});
  for(let i=0;i<8;i++){await sleep(1100);const s=await state();const t=(s.thermostats||[]).find(x=>x.real&&x.name===W.sel.name);
    if(t){W.tId=t.id;W.status=t.status;if(t.status==='connected'){goto('room');return;}if(t.status==='offline'&&i>3){W.err=W.backend==='matter'?'No Matter controller reachable. Control needs chip-tool on the hub (see Setup).':'Could not reach it on the network. Check it’s powered and on this Wi-Fi.';renderWiz();return;}}}
  if(W.tId){goto('room');}else{W.err='Setup timed out.';renderWiz();}}
function setRoomWiz(r){W.room=r;if(W.tId)post('climate-room',{id:W.tId,room:r});renderWiz();}
function finishWiz(){const nm=($("wName")||{}).value||"";if(nm.trim()&&W.tId){W.tName=nm.trim();post('rename-thermostat',{id:W.tId,name:W.tName});}W.step='done';renderWiz();}
function renderWiz(){const b=$("wizBody"),f=$("wizFoot");$("wizBack").style.visibility=(W.step==='type'||W.step==='done')?'hidden':'visible';
  if(W.step==='type'){$("wizTitle").textContent='Add a thermostat';
    b.innerHTML=`<h1>Add a thermostat</h1><p class="sub">Both are controlled locally by the hub — no cloud.</p>
      <button class="wizcard" onclick="pickBackend('esphome')"><span class="ic">🟢</span><span>ESPHome<br><span class="cap">ESP32 / Sonoff wired to your HVAC. Our own-firmware path.</span></span></button>
      <button class="wizcard" onclick="pickBackend('matter')"><span class="ic">🟣</span><span>Matter<br><span class="cap">Any Matter-certified thermostat, via the hub's Thread/Matter controller.</span></span></button>`;
    f.innerHTML=`<button onclick="closeWiz()">Cancel</button>`;
  } else if(W.step==='scan'){$("wizTitle").textContent='Searching';
    b.innerHTML=`<div class="center"><div class="radar"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core"></div></div><h1>Searching…</h1><p class="sub">Looking for ${W.backend==='matter'?'Matter':'ESPHome'} thermostats on your network.</p></div>`;f.innerHTML='';
  } else if(W.step==='results'){$("wizTitle").textContent='Choose a thermostat';
    if(W.found.length){b.innerHTML=`<h1>Found ${W.found.length}</h1><p class="sub">Tap one to add it.</p>`+W.found.map((d,i)=>`<div class="devrow" onclick="selectDevice(${i})"><span class="row" style="gap:11px"><span style="font-size:22px">🌡️</span><span><b>${esc(d.name)}</b><br><span class="cap muted small">${esc(d.address||d.node||d.backend)}</span></span></span><span class="badge">add ›</span></div>`).join('');}
    else{b.innerHTML=`<div class="center"><div style="font-size:40px;margin-top:12px">🔍</div><h1>None found</h1><p class="sub">${esc(W.note||'Nothing responded.')}</p></div>`;}
    f.innerHTML=`<button onclick="goto('scan')">↻ Scan again</button><button onclick="goto('manual')">Add manually</button>`;
  } else if(W.step==='manual'){$("wizTitle").textContent='Add manually';
    b.innerHTML=`<h1>Add manually</h1><p class="sub">Enter your ${W.backend==='matter'?'Matter':'ESPHome'} thermostat details.</p>
      <div style="display:grid;gap:12px"><label class="small muted">Name<input type="text" id="mName" placeholder="e.g. Main Thermostat" style="margin-top:5px"></label>
      <label class="small muted">IP address ${W.backend==='matter'?'<span class="muted">(or node id)</span>':'<span class="muted">(optional)</span>'}<input type="text" id="mAddr" placeholder="192.168.1.60" style="margin-top:5px"></label>
      ${W.backend==='esphome'?`<label class="small muted">Climate entity <span class="muted">(optional — climate/&lt;name&gt;)</span><input type="text" id="mEnt" placeholder="hvac" style="margin-top:5px"></label>`:''}</div>`;
    f.innerHTML=`<button onclick="goto('results')">Back</button><button class="primary" onclick="manualSubmit()">Add</button>`;
  } else if(W.step==='connect'){$("wizTitle").textContent='Connecting';
    if(W.err){b.innerHTML=`<div class="center"><div style="font-size:40px;margin-top:12px">⚠️</div><h1>Couldn’t connect</h1><p class="sub">${esc(W.err)}</p></div>`;f.innerHTML=`<button onclick="goto('results')">Back</button><button class="primary" onclick="connectSel()">Retry</button>`;}
    else{b.innerHTML=`<div class="center"><div class="spinner"></div><h1>Connecting…</h1><p class="sub">Setting up <b>${esc(W.tName)}</b>.</p></div>`;f.innerHTML='';}
  } else if(W.step==='room'){$("wizTitle").textContent='Name &amp; room';
    b.innerHTML=`<h1>Name &amp; room</h1><p class="sub">Give <b>${esc(W.tName)}</b> a name and room.</p>
      <label class="small muted">Name<input type="text" id="wName" value="${esc(W.tName)}" style="margin:5px 0 16px"></label>
      <div class="small muted">Room</div><div class="chips">${ROOMS.map(r=>`<div class="chip ${r===W.room?'on':''}" onclick="setRoomWiz('${esc(r)}')">${esc(r)}</div>`).join('')}</div>`;
    f.innerHTML=`<button class="primary" style="flex:1" onclick="finishWiz()">Continue</button>`;
  } else if(W.step==='done'){$("wizTitle").textContent='All set';
    b.innerHTML=`<div class="center"><div class="check">✓</div><h1>${esc(W.tName)} is ready</h1><p class="sub">Added to <b>${esc(W.room)}</b>. openhome keeps it connected.</p></div>`;
    f.innerHTML=`<button onclick="openWiz()">Add another</button><button class="primary" onclick="closeWiz()">Done</button>`;
  }
}
refresh();setInterval(()=>{if(!$("wizard").classList.contains('show')&&!dragging)refresh();},4000);
</script>
</body>
</html>
