<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>openhome · set up your home</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
<meta name="theme-color" content="#0e1014" />
<style>
  :root{--bg:#0e1014;--panel:#171a21;--panel2:#1e222b;--line:#272c37;--text:#e7ebf3;--muted:#8b93a7;--accent:#3ddc97;--accent-dim:#1f7a56;--danger:#ef5350}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -200px,#16241d,var(--bg));color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .shell{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(20px + env(safe-area-inset-bottom,0px))}
  .steps{display:flex;gap:6px;padding:16px 0 8px}
  .steps i{height:4px;flex:1;border-radius:3px;background:var(--panel2);transition:.3s}
  .steps i.on{background:var(--accent)}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
  h1{font-size:26px;letter-spacing:-.02em;margin:.3em 0 .3em;text-align:center}
  p.sub{color:var(--muted);text-align:center;margin:0 auto 22px;max-width:420px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .hubcard{background:linear-gradient(135deg,#16241d,#141821);border-color:var(--accent-dim)}
  .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
  .pill{width:54px;height:54px;border-radius:14px;background:#0c1512;border:1px solid var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;box-shadow:0 0 24px rgba(61,220,151,.18)}
  .svc{display:flex;align-items:center;gap:11px;padding:11px 4px;border-top:1px solid var(--line)}
  .svc:first-child{border-top:0}
  .svc .ic{width:26px;text-align:center;font-size:18px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.dot.ok{background:var(--accent);box-shadow:0 0 8px var(--accent)}.dot.no{background:#e6b800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);cursor:pointer;text-decoration:none}
  .opt:hover{border-color:var(--accent-dim);background:#232833}
  .opt .ic{font-size:26px}
  .opt b{font-size:15px}.opt span{font-size:12px;color:var(--muted)}
  input[type=text]{font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px 15px;width:100%;font-size:16px}
  .scanner{width:120px;height:120px;margin:8px auto 20px;position:relative}
  .scanner .ring{position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;opacity:0;animation:radar 1.9s ease-out infinite}
  .scanner .ring:nth-child(2){animation-delay:.63s}.scanner .ring:nth-child(3){animation-delay:1.26s}
  .scanner .core{position:absolute;inset:40%;background:var(--accent);border-radius:50%;box-shadow:0 0 18px var(--accent)}
  @keyframes radar{0%{transform:scale(.25);opacity:.85}100%{transform:scale(1);opacity:0}}
  .check{width:78px;height:78px;border-radius:50%;background:var(--accent);color:#08130d;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;animation:pop .32s ease}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .foot{display:flex;gap:10px;padding-top:8px}
  button{font:inherit;cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;flex:1;font-size:15px}
  button:hover{border-color:var(--accent-dim)}
  button.primary{background:var(--accent);color:#08130d;border-color:var(--accent);font-weight:700}
  a.skip{display:block;text-align:center;color:var(--muted);margin-top:14px;font-size:13px;text-decoration:none}
  a.skip:hover{color:var(--text)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--panel2);border:1px solid var(--accent-dim);color:var(--text);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="shell">
    <div class="steps" id="steps"></div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&#39;");
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
async function post(cmd,payload={}){try{return await (await fetch("/hub/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd,...payload})})).json();}catch(e){return{};}}
async function hubStatus(){try{return await (await fetch("/hub/status")).json();}catch(e){return null;}}

const STEPS=['welcome','find','home','ready','done'];
let step=0, HUB=null, homeName="";

function setSteps(){$("steps").innerHTML=STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join("");}
function go(i){step=i;render();}

async function render(){
  setSteps();const b=$("body"),f=$("foot");
  if(STEPS[step]==='welcome'){
    b.innerHTML=`<div class="logo"><img src="/assets/brand/logo.svg" height="30" alt="openhome"></div>
      <h1>Welcome to openhome</h1><p class="sub">Your home, your data, your keys. Let's find your hub and set up your first rooms — it takes about a minute.</p>
      <div class="card"><div class="row" style="gap:14px"><span class="pill">🏠</span><div><b>Local-first control</b><div class="small muted">Your hub runs everything on your network. Nothing phones home.</div></div></div></div>`;
    f.innerHTML=`<button class="primary" onclick="go(1)">Get started</button>`;
  } else if(STEPS[step]==='find'){
    b.innerHTML=`<div class="scanner"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core"></div></div>
      <h1>Finding your hub…</h1><p class="sub">Looking for the openhome hub on your network.</p>`;
    f.innerHTML='';
    HUB=await hubStatus(); await sleep(1100);
    if(HUB&&HUB.hub){ renderFound(); } else {
      b.innerHTML=`<div style="text-align:center;font-size:42px">📡</div><h1>No hub found</h1><p class="sub">Make sure the hub is powered on and on this network. See the setup guide to run it on your Pi.</p>`;
      f.innerHTML=`<button onclick="go(1)">↻ Retry</button><a style="flex:1" href="/docs/run-hub"><button style="width:100%">Setup guide</button></a>`;
    }
  } else if(STEPS[step]==='home'){
    b.innerHTML=`<h1>Name your home</h1><p class="sub">What should we call this home? You can change it anytime.</p>
      <input type="text" id="homeName" placeholder="e.g. The Loft" value="${esc(homeName||(HUB&&HUB.home&&HUB.home.name)||'')}" autofocus>`;
    f.innerHTML=`<button onclick="go(1)">Back</button><button class="primary" onclick="saveHome()">Continue</button>`;
    setTimeout(()=>{const el=$("homeName");if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')saveHome();});}},60);
  } else if(STEPS[step]==='ready'){
    b.innerHTML=`<h1>Add your devices</h1><p class="sub">Your hub is ready${homeName?` — welcome to <b>${esc(homeName)}</b>`:''}. Set up your first devices now, or skip and do it later.</p>
      <div class="grid2">
        <a class="opt" href="/lights"><span class="ic">💡</span><b>Lights</b><span>ESPHome &amp; Matter bulbs</span></a>
        <a class="opt" href="/speakers"><span class="ic">🔊</span><b>Speakers</b><span>Wi-Fi &amp; Bluetooth</span></a>
      </div>`;
    f.innerHTML=`<button class="primary" onclick="finish()">Finish setup</button>`;
    b.innerHTML+=`<a class="skip" href="/">Skip for now →</a>`;
  } else if(STEPS[step]==='done'){
    b.innerHTML=`<div class="check">✓</div><h1>${homeName?esc(homeName)+' is ':'Your home is '}all set</h1><p class="sub">Your hub is online and ready. Jump into the app anytime from the top bar.</p>`;
    f.innerHTML=`<a style="flex:1" href="/"><button class="primary" style="width:100%">Enter openhome</button></a>`;
  }
}
function renderFound(){
  const h=HUB.hub, svcs=HUB.services||[];
  $("body").innerHTML=`<div class="check">✓</div><h1>Hub found</h1><p class="sub">Connected to your openhome hub.</p>
    <div class="card hubcard"><div class="row between"><div class="row" style="gap:13px"><span class="pill">🧠</span><div><b>${esc(h.name)}</b><div class="small muted">${esc(h.ip)} · ${esc(h.platform)} · up ${Math.floor(h.uptimeSec/60)}m</div></div></div><span class="dot ok"></span></div></div>
    <div class="card">${svcs.map(s=>`<div class="svc"><span class="ic">${svcIcon(s.key)}</span><div style="flex:1"><b>${esc(s.label)}</b><div class="small muted">${esc(s.detail)}</div></div><span class="dot ${s.ok?'ok':'no'}"></span></div>`).join("")}</div>`;
  $("foot").innerHTML=`<button class="primary" onclick="go(2)">Pair this hub</button>`;
}
function svcIcon(k){return {lights:'💡',speakers:'🔊',music:'🎵',sync:'🔗',agent:'🤖'}[k]||'•';}
async function saveHome(){const v=($("homeName")||{}).value||"";homeName=v.trim();if(homeName)await post('name-home',{name:homeName});go(3);}
async function finish(){await post('complete-setup');go(4);}

render();
</script>
</body>
</html>
