  <text x="46" y="60" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="30" fill="#ece9f5">9:41</text><g fill="#ece9f5"><rect x="668" y="40" width="34" height="18" rx="4"/><rect x="710" y="40" width="26" height="18" rx="4"/><rect x="744" y="38" width="40" height="22" rx="5" opacity="0.5"/><rect x="746" y="40" width="30" height="18" rx="3"/></g><text x="394.0" y="150" font-family="Liberation Serif, DejaVu Serif, serif" font-weight="bold" font-size="52" fill="#ece9f5" text-anchor="middle">A letter to yourself</text><rect x="60" y="230" width="668" height="1120" rx="26" fill="#f4ecd8"/><rect x="60" y="230" width="668" height="1120" rx="26" fill="none" stroke="#d8c9a0" stroke-width="3"/><text x="114" y="326" font-family="Liberation Serif, DejaVu Serif, serif" font-style="italic" font-size="40" fill="#6b5a3a">Tuesday, after the sit &#8212;</text><text x="114" y="420" font-family="Liberation Serif, DejaVu Serif, serif" font-size="46" fill="#2c2416">What did the quiet show you today</text><text x="114" y="486" font-family="Liberation Serif, DejaVu Serif, serif" font-size="46" fill="#2c2416">that the noise had been hiding?</text><text x="114" y="592" font-family="Liberation Serif, DejaVu Serif, serif" font-style="italic" font-size="42" fill="#4a3d6b">That I'd been holding my shoulders</text><text x="114" y="664" font-family="Liberation Serif, DejaVu Serif, serif" font-style="italic" font-size="42" fill="#4a3d6b">like they were load-bearing. They</text><text x="114" y="736" font-family="Liberation Serif, DejaVu Serif, serif" font-style="italic" font-size="42" fill="#4a3d6b">aren't. The breath did the carrying,</text><text x="114" y="808" font-family="Liberation Serif, DejaVu Serif, serif" font-style="italic" font-size="42" fill="#4a3d6b">the way it always has.</text><line x1="114" y1="862" x2="674" y2="862" stroke="#ddd0ad" stroke-width="2"/><line x1="114" y1="934" x2="674" y2="934" stroke="#ddd0ad" stroke-width="2"/><line x1="114" y1="1006" x2="674" y2="1006" stroke="#ddd0ad" stroke-width="2"/><circle cx="578" cy="1200" r="76" fill="#ec4899" opacity="0.9" filter="url(#glow)"/><circle cx="578" cy="1200" r="60" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/><g filter="url(#glow)"><circle cx="578" cy="1200" r="30" fill="url(#orb)"/></g><text x="578" y="1320" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="28" fill="#8a7a55" text-anchor="middle" letter-spacing="3">SEALED</text><rect x="60" y="1410" width="668" height="120" rx="60" fill="#1a1330" stroke="#f5c977" stroke-width="2"/><g filter="url(#glow)"><circle cx="140" cy="1470" r="30" fill="url(#orb)"/><g stroke="#f5c977" stroke-width="3" stroke-linecap="round" opacity="0.9"><line x1="180" y1="1470" x2="190" y2="1470"/><line x1="168" y1="1498" x2="176" y2="1506"/><line x1="140" y1="1510" x2="140" y2="1520"/><line x1="112" y1="1498" x2="104" y2="1506"/><line x1="100" y1="1470" x2="90" y2="1470"/><line x1="112" y1="1442" x2="104" y2="1434"/><line x1="140" y1="1430" x2="140" y2="1420"/><line x1="168" y1="1442" x2="176" y2="1434"/></g></g><text x="210" y="1466" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="32" fill="#ece9f5">Talk with the Keeper</text><text x="210" y="1506" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#9a93b8">&#8220;Help me find the words.&#8221;</text><rect x="0" y="1600" width="788" height="118" fill="#0c0a16"/><line x1="0" y1="1600" x2="788" y2="1600" stroke="#241d3a" stroke-width="1.5"/><circle cx="79" cy="1640" r="7" fill="#9a93b8"/><text x="79" y="1688" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#9a93b8" text-anchor="middle">Meditate</text><circle cx="236" cy="1640" r="7" fill="#9a93b8"/><text x="236" y="1688" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#9a93b8" text-anchor="middle">Map</text><circle cx="394" cy="1640" r="7" fill="#9a93b8"/><text x="394" y="1688" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#9a93b8" text-anchor="middle">Journeys</text><circle cx="552" cy="1640" r="7" fill="#f5c977"/><text x="552" y="1688" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#f5c977" text-anchor="middle">Journal</text><circle cx="709" cy="1640" r="7" fill="#9a93b8"/><text x="709" y="1688" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#9a93b8" text-anchor="middle">Collect</text>
