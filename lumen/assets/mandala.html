<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — Wholeness Mandala v2 (ornate)</title>
<style>
  :root{ --bg:#0d0c14; --card:#14131d; --line:rgba(255,255,255,.07); --text:#f6f1ea; --muted:#8f8a9d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;padding:28px 16px 40px}
  .app{width:100%;max-width:440px}
  header{display:flex;align-items:baseline;gap:10px;margin:0 4px 18px}
  header h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  header span{color:var(--muted);font-size:14px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 10px 20px;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 42% at 50% 33%,rgba(255,80,170,.06),transparent 70%);pointer-events:none}
  .stage{position:relative;width:100%;aspect-ratio:1/1;-webkit-tap-highlight-color:transparent;user-select:none}
  .stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%}
  .stage #pearlGL{inset:auto;pointer-events:none}
  svg .hit{fill:rgba(0,0,0,0);cursor:pointer;outline:none}
  svg .hit:focus-visible{stroke:rgba(255,255,255,.5);stroke-width:1;stroke-dasharray:3 3}
  .shim{mix-blend-mode:screen;pointer-events:none}
  #glow{mix-blend-mode:screen}
  .core{cursor:pointer}

  .toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;z-index:5;
    background:rgba(26,24,36,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);
    border-radius:999px;padding:9px 16px 9px 10px;display:flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap;
    transition:opacity .45s, transform .6s cubic-bezier(.2,.9,.2,1.2)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#14121a;background:var(--c)}
  .toast b{font-weight:650}

  .panel{position:relative;margin-top:4px;padding:4px 8px 0;min-height:236px}
  .panel .fade{animation:fin .45s ease both}
  @keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ph{display:flex;align-items:center;gap:12px}
  .ph .sw{width:34px;height:34px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 38% 35%,#fff 0,var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000) 100%);box-shadow:0 0 0 2px #0d0b14, 0 0 0 3.5px var(--a), 0 0 18px color-mix(in srgb,var(--c) 50%,transparent)}
  .ph .mini{width:42px;height:42px;flex:0 0 auto;border-radius:50%;margin:-4px}
  .ph h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .ph p{color:var(--muted);font-size:13px}
  .ph .pct{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);margin:14px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--c));box-shadow:0 0 12px var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .sub{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  .ach{list-style:none;margin-top:14px;display:grid;gap:8px}
  .ach li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
  .ach li.got{background:color-mix(in srgb,var(--c) 10%,transparent);border-color:color-mix(in srgb,var(--c) 32%,transparent)}
  .ach .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:12px;border:1px solid rgba(255,255,255,.12);color:var(--muted)}
  .ach li.got .ic{background:var(--c);border-color:transparent;color:#14121a;font-weight:800;box-shadow:0 0 0 2px var(--a), 0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
  .ach li.next .ic{border-color:var(--c);color:var(--c)}
  .ach .t{flex:1;min-width:0}
  .ach .t b{display:block;font-size:14px;font-weight:600}
  .ach .t span{color:var(--muted);font-size:12px}
  .ach .r{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .ach li.got .r{color:color-mix(in srgb,var(--c) 70%,#fff)}
  .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  .chip{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);cursor:pointer;color:var(--text);font:inherit;font-size:13px;text-align:left}
  .chip:hover{background:rgba(255,255,255,.06)}
  .chip .d{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px #0d0b14,0 0 0 2.6px var(--a),0 0 8px var(--c)}
  .chip .v{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
  .navb{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--n) 35%,transparent);background:color-mix(in srgb,var(--n) 8%,transparent);color:var(--text);font:600 12.5px/1 inherit;padding:9px 12px;border-radius:999px;cursor:pointer;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navb span{color:var(--n);font-size:16px;line-height:0}
  .navb:hover{background:color-mix(in srgb,var(--n) 16%,transparent)}
  .navb.next{background:color-mix(in srgb,var(--n) 18%,transparent);border-color:color-mix(in srgb,var(--n) 55%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--n) 25%,transparent)}
  .back{margin-top:0 !important}
  .back{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;margin-top:14px}
  .back:hover{color:var(--text)}

  .controls{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
  .controls h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button.b{appearance:none;border:1px solid var(--line);background:#1d1c28;color:var(--text);font:600 13px/1 inherit;padding:10px 14px;border-radius:999px;cursor:pointer}
  button.b:hover{background:#262534}
  button.b.primary{background:linear-gradient(180deg,#ff5fb8,#e0207a);border-color:transparent;color:#1a0710}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}
  .prev{margin-top:28px}
  .prevh{display:flex;align-items:baseline;gap:10px;margin:0 4px 12px}
  .prevh h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .prevh span{color:var(--muted);font-size:13px}
  .prev iframe{display:block;width:100%;height:1300px;border:0;background:transparent;color-scheme:dark}

  /* --- embedded-in-app overrides (Lumen Collect screen) --- */
  html,body{background:transparent!important;padding:0!important;margin:0!important;height:100%!important;overflow:hidden!important;display:block!important}
  .app{max-width:none!important;width:100%!important;height:100%!important;display:flex!important;flex-direction:column!important}
  header,.controls,.prev{display:none!important}
  .card{background:transparent!important;border:none!important;border-radius:0!important;padding:2px 6px 0!important;overflow:hidden!important;flex:1 1 auto!important;display:flex!important;flex-direction:column!important;min-height:0!important}
  .card::before{display:none!important}
  .stage{flex:0 0 auto!important}
  /* panel scrolls on its own; the prev/back/next bar stays pinned flush at the top,
     with a solid backing so scrolling content never bleeds through behind it */
  .panel{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding-bottom:18px!important}
  .panel .nav{position:sticky!important;top:0!important;z-index:6;margin:0 0 12px!important;padding:12px 2px 12px!important;
    background:#0b0a12!important;border-bottom:1px solid rgba(255,255,255,.06)!important}
</style>
</head>
<body>
<div class="app">
  <header><h1>Wholeness</h1><span>your mandala</span></header>

  <section class="card">
    <div class="toast" id="toast"></div>
    <div class="stage" id="stage">
      <canvas id="fx"></canvas>
      <svg id="svg" viewBox="-215 -215 430 430" role="group" aria-label="Wholeness mandala">
        <defs id="defs">
          <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
          <filter id="blurTiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".9"/></filter>
          <filter id="lanternBlur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4"/></filter>
          <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <radialGradient id="lanternG"><stop offset="0" stop-color="#fff1d6"/><stop offset=".35" stop-color="#ffb35a" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
          <radialGradient id="coreGlow"><stop offset="0" stop-color="#ffc173" stop-opacity=".7"/><stop offset=".22" stop-color="#ff5fb8" stop-opacity=".25"/><stop offset=".6" stop-color="#a45bff" stop-opacity=".07"/><stop offset="1" stop-color="#a45bff" stop-opacity="0"/></radialGradient>
          <radialGradient id="coreFill"><stop offset="0" stop-color="#1d1a28"/><stop offset=".9" stop-color="#15131f"/><stop offset="1" stop-color="#15131f" stop-opacity="0"/></radialGradient>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#ff5fb8"/><stop offset="1" stop-color="#2ee6c5"/></linearGradient>
          <radialGradient id="pearlTeal" cx=".38" cy=".34"><stop offset="0" stop-color="#eafffb"/><stop offset=".35" stop-color="#5ff2d8"/><stop offset="1" stop-color="#0c8f7e"/></radialGradient>
          <linearGradient id="roseG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9f1c"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#fff6c2"/></linearGradient>
          <linearGradient id="curlG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c2187a"/><stop offset=".55" stop-color="#ff5fb8"/><stop offset="1" stop-color="#ffc2e4"/></linearGradient>
          <linearGradient id="daisyG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9f1c"/><stop offset=".55" stop-color="#ffe135"/><stop offset="1" stop-color="#fffbe0"/></linearGradient>
        </defs>
        <g id="mand">
          <g id="geo"></g>
          <g id="spin"></g>
          <circle r="160" fill="url(#coreGlow)" id="coreHalo"/>
          <g id="flower">
            <g id="glow" filter="url(#blur)"></g>
            <g id="ghosts"></g>
            <g id="curls"></g>
            <g id="petals"></g>
            <g id="rare"></g>
            <path id="selArc" fill="none" stroke-width="2" stroke-linecap="round" opacity="0"/>
            <g id="hits"></g>
          </g>
          <g class="core" id="core" role="button" tabindex="0" aria-label="Overview">
            <circle r="49" fill="url(#coreFill)"/>
            <g id="rose"></g>
            <circle r="39.5" fill="none" stroke="#0d0b14" stroke-width="4.5"/>
            <circle r="39.5" fill="none" stroke="#2ee6c5" stroke-width="2.2"/>
            <circle r="44" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.4"/>
            <circle id="wring" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" stroke-linecap="round" transform="rotate(-90)" pathLength="1000" stroke-dasharray="0 1000" filter="url(#ringGlow)"/>
            <circle id="pearlHalo" r="20" fill="url(#coreGlow)"/>
          </g>
        </g>
      </svg>
      <canvas id="pearlGL" aria-hidden="true"></canvas>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </section>

  <section class="controls">
    <h2>Prototype controls</h2>
    <div class="btns">
      <button class="b primary" id="sim">Complete a session ✦</button>
      <button class="b" id="bloom">Replay bloom</button>
      <button class="b" id="fresh">New member</button>
      <button class="b" id="auto">Auto-cycle: on</button>
    </div>
    <p class="hint">Each achievement adds a layer to its petal: shell → inner petal → jewel and beads → a blossom at the tip. Tap a petal, a blossom between petals, or the center.</p>
  </section>

  <section class="prev">
    <div class="prevh"><h2>Previous design</h2><span>v1 · glow petals</span></div>
    <iframe id="v1" src="v1.html#embed" title="Previous mandala design" loading="lazy"></iframe>
  </section>
</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#0d0b14';

// ---------------- data ----------------
const DIMS = [
  { id:'stillness',   name:'Stillness',   tag:'Time spent in quiet sitting', color:'#FFC83D', accent:'#FF2E93', unit:'minutes',         step:40, value:420,
    tiers:[['First sit','Complete your first session',1],['An hour of quiet','Sit for 60 minutes in total',60],['Steady mind','Sit for 300 minutes in total',300],['Thousand minutes','Sit for 1,000 minutes in total',1000]] },
  { id:'depth',       name:'Depth',       tag:'Longer, deeper sits',         color:'#8C5CFF', accent:'#2EE6C5', unit:'sits of 20+ min', step:2, value:14,
    tiers:[['Going deeper','Your first 20-minute sit',1],['Settling in','10 sits of 20+ minutes',10],['Deep water','25 sits of 20+ minutes',25],['The long sit','50 sits of 20+ minutes',50]] },
  { id:'exploration', name:'Exploration', tag:'Journeys and new practices',  color:'#9BE564', accent:'#A45BFF', unit:'journeys',        step:1, value:1,
    tiers:[['First journey','Complete a journey',1],['Wayfinder','Complete 3 journeys',3],['Cartographer','Complete 8 journeys',8],['Whole map','Complete 15 journeys',15]] },
  { id:'breath',      name:'Breath',      tag:'Breathwork practice',         color:'#22D3B6', accent:'#FFE135', unit:'breath sessions', step:4, value:130,
    tiers:[['First breath','Complete a breathwork session',1],['Rhythm','15 breathwork sessions',15],['Tidal','40 breathwork sessions',40],['Ocean','120 breathwork sessions',120]] },
  { id:'connection',  name:'Connection',  tag:'Sitting alongside others',    color:'#4D7CFF', accent:'#FF7AC6', unit:'group sits',      step:1, value:0,
    tiers:[['Not alone','Sit while others are meditating',1],['Kindred','5 group sits',5],['Sangha','20 group sits',20],['Lantern','50 group sits',50]] },
  { id:'reflection',  name:'Reflection',  tag:'Journaling what you notice',  color:'#FF2E93', accent:'#FFD23F', unit:'reflections',     step:2, value:12,
    tiers:[['First page','Write your first reflection',1],['Noticing','10 reflections',10],['Inner voice','30 reflections',30],['A life examined','100 reflections',100]] },
  { id:'consistency', name:'Consistency', tag:'Showing up, day after day',   color:'#FF8A1F', accent:'#2EE6C5', unit:'day best streak', step:2, value:12,
    tiers:[['Three in a row','A 3-day streak',3],['A full week','A 7-day streak',7],['Moon cycle','A 30-day streak',30],['Unbroken','A 100-day streak',100]] },
];
const RARE = [
  { name:'Dawn sitter',    desc:'Meditate before 6 a.m.',                 got:true  },
  { name:'Full moon',      desc:'Sit on the night of a full moon',        got:false },
  { name:'Century',        desc:'Complete 100 sessions',                  got:false },
  { name:'Perfect week',   desc:'Meditate every day of a calendar week',  got:true  },
  { name:'Silent hour',    desc:'A single 60-minute sit',                 got:false },
  { name:'Night owl',      desc:'Meditate after midnight',                got:true  },
  { name:'Kindred spirit', desc:'Sit at the same moment as a friend',     got:false },
];
const START = DIMS.map(d => d.value), START_R = RARE.map(r => r.got);

// ---------------- geometry ----------------
const N = DIMS.length, STEP = 360 / N;
const R0 = 48, LMAX = 124, W = 31;
const ringR = 192, LANT_R = 203, BLOSSOM_R = 166;
const rad = d => d * Math.PI / 180;
const polar = (deg, r) => [Math.sin(rad(deg)) * r, -Math.cos(rad(deg)) * r];
const f2 = v => v.toFixed(2);

// onion-dome petal (bulb, then a concave flare into a point), with optional sideways bend
function ogee(r0, len, w, bend = 0){
  len = Math.max(len, .6);
  const b = -r0, ox = bend * len;
  const P = (x, f) => `${f2(x + ox * f * f)} ${f2(b - len * f)}`;
  return `M${P(0,0)} C ${P(w*.55,.02)} ${P(w*1.15,.3)} ${P(w*.82,.58)} C ${P(w*.55,.78)} ${P(w*.07,.85)} ${P(0,1)}`
       + ` C ${P(-w*.07,.85)} ${P(-w*.55,.78)} ${P(-w*.82,.58)} C ${P(-w*1.15,.3)} ${P(-w*.55,.02)} ${P(0,0)} Z`;
}
// teardrop: round bottom, pointed top. f-coordinates measured along the parent petal
function drop(r0, len, w, bend, parentLen){
  parentLen = Math.max(parentLen, 1); len = Math.max(len, .5);
  const b = -r0, B = bend * parentLen, base = (r0 - R0) / parentLen;
  const P = (x, f) => { const g = base + f * len / parentLen; return `${f2(x + B * g * g)} ${f2(b - len * f)}`; };
  return `M${P(0,0)} C ${P(w,0)} ${P(w*.95,.55)} ${P(0,1)} C ${P(-w*.95,.55)} ${P(-w,0)} ${P(0,0)} Z`;
}
const widthFor = len => Math.min(W, 10 + len * .29);
const spineX = (bend, len, r) => { const f = Math.max(0, (r - R0) / Math.max(len, 1)); return bend * len * f * f; };

function mix(hex, to, t){
  const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
const hexRgb = h => [16, 8, 0].map(s => (parseInt(h.slice(1), 16) >> s) & 255);

function fillOf(d){
  const n = d.tiers.length, earned = d.tiers.filter(t => d.value >= t[2]).length;
  if (earned >= n) return 1;
  const prev = earned ? d.tiers[earned - 1][2] : 0, next = d.tiers[earned][2];
  return (earned + Math.max(0, Math.min(1, (d.value - prev) / (next - prev)))) / n;
}
const earnedOf = d => d.tiers.filter(t => d.value >= t[2]).length;
function wholeness(){
  const main = DIMS.reduce((s, d) => s + fillOf(d), 0) / N;
  return main * .88 + RARE.filter(r => r.got).length / RARE.length * .12;
}

// ---------------- static geometry ----------------
const geo = $('geo'), spin = $('spin'), defs = $('defs');
const LANTERNS = [];
el('circle', { r:ringR, fill:'none', stroke:'rgba(255,255,255,.08)', 'stroke-width':.8, id:'outerC' }, geo);
el('circle', { r:100, fill:'none', stroke:'rgba(255,255,255,.07)', 'stroke-width':.7, id:'innerC' }, geo);
for (let i = 0; i < 84; i++){
  if (i % 12 === 0) continue;
  const [x, y] = polar(i * 360 / 84, LANT_R);
  el('circle', { cx:f2(x), cy:f2(y), r:.9, fill: i % 2 ? '#7ff0dc' : '#ff9fd2', opacity: .18 + .2 * ((i * 37) % 7) / 7 }, spin);
}
for (let i = 0; i < 7; i++){
  const a = i * 360 / 7, [x, y] = polar(a, LANT_R);
  LANTERNS.push({ a,
    trail: el('path', { fill:'none', stroke:'#ffc77a', 'stroke-linecap':'round', 'stroke-width':2.2, filter:'url(#lanternBlur)' }, spin),
    glow:  el('circle', { cx:x, cy:y, r:6, fill:'url(#lanternG)', filter:'url(#lanternBlur)' }, spin),
    core:  el('circle', { cx:x, cy:y, r:2, fill:'#fff3dc' }, spin) });
}

// ---------------- petals ----------------
const L = { glow:$('glow'), ghosts:$('ghosts'), curls:$('curls'), petals:$('petals'), rare:$('rare'), hits:$('hits') };
let hoverId = -1, sel = null;
function grad(id, stops, x1 = 0, y1 = 1, x2 = 0, y2 = 0){
  const g = el('linearGradient', { id, x1, y1, x2, y2 }, defs);
  stops.forEach(([o, c, a = 1]) => el('stop', { offset:o, 'stop-color':c, 'stop-opacity':a }, g));
}
DIMS.forEach((d, i) => {
  d.angle = i * STEP; d.disp = 0; d.vel = 0; d.scale = 1; d.delay = 0; d.bend = 0; d.bv = 0; d.sway = 0;
  d.lay = [0, 0, 0, 0]; d.layV = [0, 0, 0, 0];
  const dark = mix(d.color, '#000000', .45), light = mix(d.color, '#ffffff', .6);
  const aDark = mix(d.accent, '#000000', .4), aLight = mix(d.accent, '#ffffff', .55);
  d.light = light;
  grad(`sh${i}`, [[0, dark], [.45, d.color], [1, light]]);
  grad(`in${i}`, [[0, aDark], [.5, d.accent], [1, aLight]]);
  grad(`dr${i}`, [[0, d.color], [1, '#ffffff']]);
  const shim = el('linearGradient', { id:`sm${i}`, x1:0, y1:1, x2:0, y2:0 }, defs);

// ---------------- breath + wind (one clock) ----------------
const INH = 5, EXH = 7, CYCLE = INH + EXH;
const easeIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

  const ph = ((tl % CYCLE) + CYCLE) % CYCLE, RISE = 1.8;
