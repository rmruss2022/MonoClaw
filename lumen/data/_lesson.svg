<svg xmlns="http://www.w3.org/2000/svg" width="380" height="620"><rect width="380" height="620" fill="#0b0a12"/><text x="18" y="34" fill="#9a93b8" font-family="sans-serif" font-size="11" letter-spacing="2">GUIDED LESSONS</text><rect x="14" y="48" rx="18" width="352" height="132" fill="#15111f" stroke="#2a2540"/><defs><radialGradient id="vg" cx="50%" cy="40%"><stop offset="0" stop-color="#2a2140"/><stop offset="1" stop-color="#100c1c"/></radialGradient><linearGradient id="gGold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="40" y2="40"><stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#e0953a"/></linearGradient></defs><rect x="14" y="48" width="98" height="132" fill="url(#vg)"/><g transform="translate(45.0,96.0)"><g transform="scale(1.5)" fill="none" stroke="#f5c977" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c-4.2 0-7.5-2.6-7.5-5.2 2 0 3.2.5 4.2 1.3C8 13 9.6 10.2 12 7.5c2.4 2.7 4 5.5 3.3 8.6 1-.8 2.2-1.3 4.2-1.3C19.5 17.4 16.2 20 12 20Z" fill="#f5c977" stroke="none"/></g></g><text x="126" y="74" fill="#ece9f5" font-family="sans-serif" font-size="15" font-weight="700">Vishnu <tspan fill="#9a93b8" font-size="12">· The Still Point…</tspan></text><text x="126" y="91" fill="#9a93b8" font-family="sans-serif" font-size="9.5" letter-spacing="0.5">HINDU · THE PRESERVER · 22 MIN · OCEAN BREATH</text><text x="126" y="110" fill="#cbbfe6" font-family="Georgia,serif" font-size="12">A guided journey into Vishnu, the</text><text x="126" y="126" fill="#cbbfe6" font-family="Georgia,serif" font-size="12">Preserver — ocean breath, the four</text><text x="126" y="142" fill="#cbbfe6" font-family="Georgia,serif" font-size="12">inner gifts, the mantra Om Namo</text><text x="126" y="158" fill="#cbbfe6" font-family="Georgia,serif" font-size="12">Narayanaya.</text><g transform="translate(126.0,160.0)"><g transform="scale(0.5)" fill="none" stroke="#5fa8ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5 19 12 7 19.5V4.5Z" fill="#5fa8ff" stroke="none"/></g></g><text x="144" y="170" fill="#5fa8ff" font-family="sans-serif" font-size="12" font-weight="700">Begin lesson · earns Light</text><line x1="0" y1="200" x2="380" y2="200" stroke="#1c1830"/><text x="18" y="222" fill="#ece9f5" font-family="sans-serif" font-size="15" font-weight="700"><tspan fill="#5fa8ff">Vishnu</tspan> <tspan fill="#9a93b8" font-size="13">· The Still Point that Holds the World</tspan></text><text x="18" y="240" fill="#9a93b8" font-family="sans-serif" font-size="12">Step 3 of 8 · Ujjayi — the sound of the deep</text><rect x="18" y="248" rx="4" width="344" height="7" fill="#241d3a"/><rect x="18" y="248" rx="4" width="113" height="7" fill="#f5c977"/><circle cx="190.0" cy="345" r="70" fill="#a855f7" opacity="0.1"/><defs><radialGradient id="orb" cx="50%" cy="40%"><stop offset="0" stop-color="#f7d99a"/><stop offset="55%" stop-color="#c084fc"/><stop offset="100%" stop-color="#6d28d9"/></radialGradient></defs><circle cx="190.0" cy="345" r="62" fill="url(#orb)"/><text x="190.0" y="351" fill="#1a0b2e" font-family="sans-serif" font-size="30">◦</text><text x="190.0" y="437" fill="#9a93b8" font-family="sans-serif" font-size="12" letter-spacing="1" text-anchor="middle">SOFTEN THE THROAT. LET THE BREATH WHISPER.</text><text x="190.0" y="465" fill="#e8e2f2" font-family="Georgia,serif" font-size="14" text-anchor="middle">Narrow the back of the throat, as if to fog a</text><text x="190.0" y="485" fill="#e8e2f2" font-family="Georgia,serif" font-size="14" text-anchor="middle">mirror, and let each breath hush like waves.</text><text x="190.0" y="505" fill="#e8e2f2" font-family="Georgia,serif" font-size="14" text-anchor="middle">This is Ujjayi, the ocean breath — its sound</text><text x="190.0" y="525" fill="#e8e2f2" font-family="Georgia,serif" font-size="14" text-anchor="middle">is the shankha, Vishnu's conch, the first</text><text x="190.0" y="545" fill="#e8e2f2" font-family="Georgia,serif" font-size="14" text-anchor="middle">vibration from which all worlds arose.</text><circle cx="34" cy="586" r="21" fill="#1b1530" stroke="#2a2540"/><g transform="translate(24.0,576.0)"><g transform="scale(0.8333333333333334)" fill="none" stroke="#a855f7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z" fill="#a855f7" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></g><text x="190.0" y="591" fill="#9a93b8" font-family="sans-serif" font-size="13" text-anchor="middle">13:40 left</text><rect x="284" y="568" rx="12" width="80" height="38" fill="none" stroke="#2a2540"/><text x="324" y="591" fill="#e3ddf1" font-family="sans-serif" font-size="13" text-anchor="middle">End</text></svg>