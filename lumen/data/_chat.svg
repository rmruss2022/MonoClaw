ne x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.6" y1="5.6" x2="7.3" y2="7.3"/><line x1="16.7" y1="16.7" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="16.7" y2="7.3"/><line x1="7.3" y1="16.7" x2="5.6" y2="18.4"/></g></g></g><rect x="48" y="72" rx="16" width="250" height="70" fill="#17132a" stroke="#2a2540"/><text x="62" y="94" fill="#ece9f5" font-family="sans-serif" font-size="13.5">Hello, Matthew. I'm the Keeper.</text><text x="62" y="112" fill="#ece9f5" font-family="sans-serif" font-size="13.5">Talk to me, ask about your practice,</text><text x="62" y="130" fill="#ece9f5" font-family="sans-serif" font-size="13.5">or say "write this down."</text><rect x="134" y="156" rx="16" width="230" height="34" fill="#33286a"/><text x="148" y="178" fill="#fff" font-family="sans-serif" font-size="13.5">How many days is my streak?</text><circle cx="28" cy="218" r="14" fill="#1a1330" stroke="#2a2540"/><g transform="translate(20.5,210.5)"><g transform="scale(0.625)" fill="none" stroke="#f5c977" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" fill="#f5c977" stroke="none"/><g><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.6" y1="5.6" x2="7.3" y2="7.3"/><line x1="16.7" y1="16.7" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="16.7" y2="7.3"/><line x1="7.3" y1="16.7" x2="5.6" y2="18.4"/></g></g></g><rect x="48" y="204" rx="16" width="250" height="52" fill="#17132a" stroke="#2a2540"/><text x="62" y="226" fill="#ece9f5" font-family="sans-serif" font-size="13.5">You've got a 7-day streak going,</text><text x="62" y="244" fill="#ece9f5" font-family="sans-serif" font-size="13.5">and 24 sessions in all. Beautiful.</text><rect x="134" y="270" rx="16" width="230" height="52" fill="#33286a"/><text x="148" y="292" fill="#fff" font-family="sans-serif" font-size="13.5">Journal this: grateful after a</text><text x="148" y="310" fill="#fff" font-family="sans-serif" font-size="13.5">long walk by the river today.</text><circle cx="28" cy="350" r="14" fill="#1a1330" stroke="#2a2540"/><g transform="translate(20.5,342.5)"><g transform="scale(0.625)" fill="none" stroke="#f5c977" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" fill="#f5c977" stroke="none"/><g><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.6" y1="5.6" x2="7.3" y2="7.3"/><line x1="16.7" y1="16.7" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="16.7" y2="7.3"/><line x1="7.3" y1="16.7" x2="5.6" y2="18.4"/></g></g></g><rect x="48" y="336" rx="16" width="250" height="52" fill="#17132a" stroke="#2a2540"/><text x="62" y="358" fill="#ece9f5" font-family="sans-serif" font-size="13.5">Saved it. There's something</text><text x="62" y="376" fill="#ece9f5" font-family="sans-serif" font-size="13.5">restorative about moving water.</text><circle cx="34" cy="524" r="22" fill="#1b1530" stroke="#2a2540"/><g transform="translate(24.0,514.0)"><g transform="scale(0.8333333333333334)" fill="none" stroke="#a855f7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3" fill="#a855f7" stroke="none"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></g></g><rect x="66" y="506" rx="22" width="252" height="40" fill="#0f0d18" stroke="#2a2540"/><text x="84" y="531" fill="#6f6790" font-family="sans-serif" font-size="14">Talk to the Keeper…</text><circle cx="346" cy="524" r="22" fill="#7c3aed"/><g transform="translate(336.0,514.0)"><g transform="scale(0.8333333333333334)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11