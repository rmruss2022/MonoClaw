<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="640" height="360" fill="#fdf6e3"/>
<text x="40" y="80" font-family="Comic Sans MS, cursive" font-size="30" fill="#333">Today I sat for twenty minutes</text>
<text x="40" y="130" font-family="Comic Sans MS, cursive" font-size="30" fill="#333">and watched my breath come and go.</text>
<text x="40" y="180" font-family="Comic Sans MS, cursive" font-size="30" fill="#333">I felt calmer than I have in weeks.</text></svg>
